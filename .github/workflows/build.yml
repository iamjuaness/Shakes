name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publicar el release al subir una etiqueta v*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # los tests usan `node archivo.ts` (type stripping)
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests y tipos
        shell: bash
        run: |
          node src/tree.test.ts
          node src/export.test.ts
          node src/plugins.test.ts
          node src/update.test.ts
          node src/newProject.test.ts
          node src/remote.test.ts
          node plugins/herramientas/herramientas.test.ts
          node plugins/herramientas/fichas-auto/detect.test.ts
          npx tsc --noEmit

      - name: Compilar instalador
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Shakes-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Notas de la release (sección de CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0,"## [")==1{p=index($0,"["v"]")>0; next} p' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Ver CHANGELOG.md" > RELEASE_NOTES.md

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          body_path: RELEASE_NOTES.md
