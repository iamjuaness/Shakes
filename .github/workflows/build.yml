name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publicar el release al subir una etiqueta v*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # los tests usan `node archivo.ts` (type stripping)
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests y tipos
        shell: bash
        run: |
          node scripts/test.mjs
          npx tsc --noEmit

      # Firma el instalador si ya está la clave (ver docs/actualizador.md); si no, compila como siempre.
      - name: Compilar instalador
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && ! grep -q '"pubkey": ""' src-tauri/tauri.updater.conf.json; then
            npm run tauri build -- --config src-tauri/tauri.updater.conf.json
          else
            npm run tauri build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Shakes-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Notas de la release (sección de CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0,"## [")==1{p=index($0,"["v"]")>0; next} p' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Ver CHANGELOG.md" > RELEASE_NOTES.md

      - name: latest.json del actualizador
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ls src-tauri/target/release/bundle/nsis/*.sig >/dev/null 2>&1; then node scripts/latest-json.mjs "$GITHUB_REF_NAME"; fi

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          body_path: RELEASE_NOTES.md
