[package]
name = "shakes"
version = "0.4.0"
description = "Shakes: herramienta de escritura de historias"
authors = ["iamjuaness"]
license-file = "../LICENSE"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# El sufijo `_lib` evita un conflicto de nombres con el binario en Windows (rust-lang/cargo#8519).
name = "shakes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
